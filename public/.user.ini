; PHP-FPM reads this file next to the script it runs, so it raises the limits
; for this site without touching the server. Ploi's PHP settings override it
; only if they are set higher there; whichever is lower wins in practice, so
; the server panel stays the place to go for anything bigger.
;
; The application syncs a decade of ERP documents and renders a 52-week cash
; flow, and the default 128M leaves no headroom for either.
memory_limit = 256M

; A history sync started from the web returns straight away, but an inline
; migration on a large table can take a while.
max_execution_time = 120
